<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dark Graph Viewer</title>
    <!-- Include vis-network library -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 15px 20px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #bb86fc;
        }
        #controls {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #444;
        }
        #main-container {
            display: flex;
            flex: 1;
            position: relative;
        }
        #network-container {
            flex: 1;
            height: 100%;
        }
        #info-panel {
            width: 350px;
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #info-panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #03dac6;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .info-row {
            margin-bottom: 15px;
        }
        .info-label {
            font-weight: bold;
            color: #9e9e9e;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 1.5rem;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #bb86fc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #info-panel::-webkit-scrollbar {
            width: 8px;
        }
        #info-panel::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        #info-panel::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        #info-panel::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Codebase Knowledge Graph</h1>
        <div id="controls">
            <button id="btn-fit">Fit to Screen</button>
            <input type="file" id="file-input" accept=".json" style="display: none;" />
            <button id="btn-load" onclick="document.getElementById('file-input').click()">Load graph.json</button>
        </div>
    </div>

    <div id="main-container">
        <div id="loading" style="display: none;">
            <div class="spinner"></div>
            <div id="loading-text">Rendering graph...</div>
        </div>
        <div id="network-container"></div>
        <div id="info-panel">
            <h2>Node Details</h2>
            <div id="info-content">
                <p style="color: #777; font-style: italic;">Select a node to view its details.</p>
            </div>
        </div>
    </div>

    <script>
        let network = null;
        const container = document.getElementById('network-container');
        const infoContent = document.getElementById('info-content');
        const loading = document.getElementById('loading');

        const typeColors = {
            'file': '#bb86fc', // Purple
            'class': '#03dac6', // Teal
            'function': '#cf6679', // Pink
            'method': '#ffb74d', // Orange
            'variable': '#4dd0e1', // Cyan
            'interface': '#81c784', // Light Green
            'default': '#a0a0a0'
        };

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'flex';
            document.getElementById('loading-text').innerText = 'Loading file...';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    processGraphData(data);
                } catch (err) {
                    alert('Error parsing JSON file: ' + err.message);
                    loading.style.display = 'none';
                }
            };
            reader.readAsText(file);
        });

        function processGraphData(graphData) {
            document.getElementById('loading-text').innerText = 'Processing nodes...';

            setTimeout(() => {
                const nodes = new vis.DataSet();
                const edges = new vis.DataSet();
                let actualNodes = 0;
                let actualEdges = 0;

                // Handle nested graphify JSON structure
                const graphRef = graphData.graph || graphData;

                let sourceNodes = graphData.nodes || graphRef.nodes || [];
                // Support dictionary-based node list if it happens to be exported that way
                if (!Array.isArray(sourceNodes) && typeof sourceNodes === 'object') {
                    sourceNodes = Object.values(sourceNodes);
                }

                sourceNodes.forEach(n => {
                    const type = n.type || 'default';
                    const color = typeColors[type] || typeColors['default'];
                    // ID can sometimes be missing or in 'key' in older graphify versions
                    const nodeId = n.id || n.key;

                    if (nodeId) {
                        nodes.add({
                            id: nodeId,
                            label: n.name || n.label || nodeId.split('/').pop(),
                            title: nodeId, // Tooltip
                            color: {
                                background: color,
                                border: darkenColor(color, 20),
                                highlight: { background: lightenColor(color, 20), border: '#fff' }
                            },
                            font: { color: '#ffffff', strokeWidth: 0 },
                            shape: type === 'file' ? 'box' : 'dot',
                            size: type === 'file' ? 25 : 15,
                            _rawData: n
                        });
                        actualNodes++;
                    }
                });

                document.getElementById('loading-text').innerText = `Processing ${actualNodes} nodes and extracting edges...`;

                setTimeout(() => {
                    // Look for both edges and links (graphify output uses links)
                    let sourceEdges = graphData.edges || graphRef.edges || graphData.links || graphRef.links || [];

                    sourceEdges.forEach(e => {
                        const source = e.source || e.from;
                        const target = e.target || e.to;
                        if (source && target) {
                            edges.add({
                                from: source,
                                to: target,
                                label: e.type || e.label || '',
                                font: { size: 10, color: '#888', align: 'middle' },
                                color: { color: '#555', highlight: '#bb86fc', hover: '#03dac6' },
                                arrows: 'to',
                                smooth: { type: 'continuous' }
                            });
                            actualEdges++;
                        }
                    });

                    document.getElementById('loading-text').innerText = `Rendering ${actualNodes} nodes and ${actualEdges} edges...`;
                    renderNetwork(nodes, edges);
                }, 50);
            }, 50);
        }

        function renderNetwork(nodes, edges) {
            setTimeout(() => {
                const data = { nodes: nodes, edges: edges };
                const options = {
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        keyboard: true
                    },
                    physics: {
                        enabled: true,
                        barnesHut: {
                            gravitationalConstant: -2000,
                            centralGravity: 0.3,
                            springLength: 95,
                            springConstant: 0.04,
                            damping: 0.09,
                            avoidOverlap: 0.1
                        },
                        stabilization: {
                            enabled: true,
                            iterations: 500,
                            updateInterval: 25,
                            onlyDynamicEdges: false,
                            fit: true
                        }
                    },
                    layout: {
                        improvedLayout: false // Better performance for large graphs
                    }
                };

                if (network) {
                    network.destroy();
                }

                network = new vis.Network(container, data, options);

                network.on("stabilizationProgress", function(params) {
                    document.getElementById('loading-text').innerText = 'Physics stabilization: ' + Math.round((params.iterations/params.total) * 100) + '%';
                });

                network.on("stabilizationIterationsDone", function() {
                    loading.style.display = 'none';
                    network.fit();
                });

                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const nodeData = nodes.get(nodeId)._rawData;
                        updateInfoPanel(nodeData);
                    } else {
                        infoContent.innerHTML = '<p style="color: #777; font-style: italic;">Select a node to view its details.</p>';
                    }
                });

                // Fail-safe hide loading
                setTimeout(() => { loading.style.display = 'none'; }, 10000);
            }, 50);
        }

        function updateInfoPanel(data) {
            let html = '';

            const renderField = (label, value) => {
                if (value === undefined || value === null || value === '') return;
                html += `<div class="info-row">
                            <div class="info-label">${label}</div>
                            <div class="info-value">${value}</div>
                         </div>`;
            };

            const nodeId = data.id || data.key;
            renderField('ID', nodeId);
            renderField('Name', data.name || data.label);
            renderField('Type', `<span style="color: ${typeColors[data.type] || '#ccc'}">${data.type || 'unknown'}</span>`);
            renderField('File', data.file);
            renderField('Line', data.line);

            if (data.description) {
                renderField('Description', data.description);
            }
            if (data.communities && data.communities.length > 0) {
                renderField('Communities', data.communities.join(', '));
            }

            html += `<div class="info-row" style="margin-top: 20px;">
                        <div class="info-label">Raw Data</div>
                        <div class="info-value"><pre style="background: #111; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 0.8rem; border: 1px solid #333; margin:0; max-height: 400px;">${JSON.stringify(data, null, 2)}</pre></div>
                     </div>`;

            infoContent.innerHTML = html;
        }

        document.getElementById('btn-fit').addEventListener('click', () => {
            if (network) network.fit({ animation: true });
        });

        function darkenColor(color, percent) {
            var num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) - amt,
            B = (num >> 8 & 0x00FF) - amt,
            G = (num & 0x0000FF) - amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }
        function lightenColor(color, percent) {
            var num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        window.onload = () => {
            loading.style.display = 'flex';
            document.getElementById('loading-text').innerText = 'Attempting to load graph.json automatically...';

            fetch('.graphify/graph.json')
                .then(response => {
                    if (!response.ok) throw new Error('Not found');
                    return response.json();
                })
                .then(data => {
                    processGraphData(data);
                })
                .catch(err => {
                    loading.style.display = 'none';
                    console.log('Could not auto-load graph.json, user must load manually.', err);
                });
        };
    </script>
</body>
</html>
