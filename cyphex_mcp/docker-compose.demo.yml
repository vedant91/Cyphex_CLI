# Try the Cyphex MCP server in a container — a tutorial/experiment image, not
# the production deployment story (that's still local stdio via `claude mcp
# add`, per README.md). No target app runs in here; this container only
# serves playbooks and the deterministic gates over streamable-http.
#
#   cd cyphex_mcp && docker compose -f docker-compose.demo.yml up --build
#   # then point an MCP client (e.g. mcp-remote, MCP Inspector) at
#   # http://localhost:8765/mcp
services:
  cyphex-mcp-demo:
    build: .
    # Localhost only by default. To let a friend connect, set CYPHEX_MCP_BIND=0.0.0.0 (or a
    # LAN / Tailscale IP) and put HTTPS in front: the token travels in a header, in clear over plain HTTP.
    # Then share http://<your-host-LAN-IP>:8765/mcp + CYPHEX_MCP_TOKEN; the friend pastes examples/mcp.remote.json.
    ports: ["${CYPHEX_MCP_BIND:-127.0.0.1}:8765:8765"]
    environment:
      CYPHEX_MCP_TOKEN: ${CYPHEX_MCP_TOKEN:?set CYPHEX_MCP_TOKEN, e.g. export CYPHEX_MCP_TOKEN=$(openssl rand -hex 24)}
    read_only: true
    tmpfs: [/tmp]
    volumes: [cyphex-data:/data]   # scan jobs and reports survive restarts
    mem_limit: 256m
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    restart: unless-stopped
volumes:
  cyphex-data:
