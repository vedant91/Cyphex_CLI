[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyphex"
version = "0.1.0"
description = "AI-powered security scanner with adversarial immune system — runs 100% locally"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "scanner", "vulnerability", "ai", "immune-system", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
cloud = ["openai>=1.0.0"]
reasoning = ["agent-reasoning>=1.0.8"]
memory = ["cognee[ollama]>=1.2.0,<2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]


[project.scripts]
cyphex = "cyphex.cli:main"

[tool.setuptools]
# Top-level engine modules that live at the repo root (outside the cyphex/
# package) but are imported by cyphex.cli. Declared so an editable install
# (`pip install -e .`) exposes them and `cyphex` can open the workspace.
py-modules = ["cli_engine", "cx", "terminal_ui", "cyphex_cli", "cyphex_benchmark"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cyphex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
